name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 30s
      - run: go build -ldflags="-s -w" -o gh-starview .
      - run: ./gh-starview --help
      - run: ./gh-starview --json --limit 2 | head -20
