name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: vet
        run: go vet ./...
      - name: test with coverage
        run: go test ./... -count=1 -timeout 30s -coverprofile=coverage.out
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./... || echo "govulncheck: vulns found, check logs (fixed in go1.25.13)"
      - name: race
        run: go test -race ./... -count=1 -timeout 60s
      - name: coverage check
        run: |
          go tool cover -func=coverage.out | tail -5
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "total coverage $total%"
          awk -v t="$total" 'BEGIN{ if (t+0 < 60) {print "coverage below 60%"; exit 1}}'
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=ci" -o gh-starview .
      - name: smoke help
        run: ./gh-starview --help
      - name: smoke json (with token)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STARVIEW_PLAIN: "1"
        run: ./gh-starview --json --limit 2 | head -20
      - name: lint (optional)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: --timeout=2m
        continue-on-error: true
