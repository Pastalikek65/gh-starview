version: 2
project_name: gh-starview

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./... -count=1 -timeout 30s
    - govulncheck ./... || true

builds:
  - id: gh-starview
    main: .
    binary: gh-starview
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - android
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: android
        goarch: amd64
    ldflags:
      - -s -w -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: binaries
    builds:
      - gh-starview
    name_template: "gh-starview-{{ .Os }}-{{ .Arch }}"
    format: binary

checksum:
  name_template: "checksums.txt"

release:
  footer: |
    ### Install
    ```bash
    gh extension install Pastalikek65/gh-starview
    # or
    go install github.com/Pastalikek65/gh-starview@{{.Tag}}
    ```
  prerelease: auto
